# GitHub Actions for BethStudio.
#
# The Cargo workspace is `upstream-wezterm/` (vendored WezTerm + delta).
# We do not treat it as a git submodule and we do not `cargo fmt --all`
# or `-D warnings` over upstream — that tree is full of inherited lints.
#
# Full `wezterm-gui` / installer builds stay local (MSVC + Perl, 30+ min).
# CI runs the Beth Studio delta tests (`wtinator`) on Linux.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  tree:
    name: public-tree sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present, local junk absent
        run: |
          set -euo pipefail
          test -f NOTICE.md
          test -f LICENSE.md
          test -f README.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f upstream-wezterm/PATCHES.md
          test -f upstream-wezterm/wtinator/data/gogh-themes.json
          test -f upstream-wezterm/bethstudio-setup/Cargo.toml
          test ! -e HANDOFF.md
          test ! -e STATUS.md
          test ! -d upstream-wezterm/target-test-release-20260830

  wtinator:
    name: wtinator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: upstream-wezterm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Native deps (openssl-sys)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: cargo test -p wtinator --lib
        run: cargo test -p wtinator --lib

  studio:
    name: Studio (Go + React) tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bethstudio-web/go.mod
          cache-dependency-path: bethstudio-web/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - name: Frontend tests and build
        working-directory: bethstudio-web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Copy the build next to the Go embed
        shell: pwsh
        run: |
          Get-ChildItem bethstudio-web/webui/dist -Force | Where-Object { $_.Name -ne '.gitkeep' } | Remove-Item -Recurse -Force
          Copy-Item -Recurse -Force bethstudio-web/frontend/dist/* bethstudio-web/webui/dist
      - name: Go vet and tests
        working-directory: bethstudio-web
        run: |
          go vet -unsafeptr=false ./...
          go test -count=1 ./...
      # TEMPORARIO: mostra a tela do teste que falha como anotacao (visivel sem login).
      - name: Diagnostico dos testes Go
        if: failure()
        working-directory: bethstudio-web
        shell: pwsh
        run: |
          $o = go test -count=1 -run TestSSHHelperInConPTY . 2>&1 | Out-String
          $i = $o.IndexOf('tela at')
          if ($i -lt 0) { $i = 0 }
          $t = $o.Substring($i)
          if ($t.Length -gt 3500) { $t = $t.Substring(0, 3500) }
          $t = $t -replace "`e\[[0-9;?]*[A-Za-z]", '' -replace "`r", '' -replace "`n", '%0A'
          Write-Host "::error::tela=$t"
