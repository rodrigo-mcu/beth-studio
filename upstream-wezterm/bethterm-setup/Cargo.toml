[package]
name = "bethterm-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "BethTerm native Win32 installer / updater (embedded zstd payload)."

[[bin]]
name = "bethterm-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tar = "0.4"
zstd.workspace = true

[build-dependencies]
anyhow.workspace = true
tar = "0.4"
zstd.workspace = true

[target.'cfg(windows)'.build-dependencies]
cc.workspace = true
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
