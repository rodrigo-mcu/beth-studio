[package]
name = "bethterm"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false
description = "BethTerm — terminal multiplexer with tab groups, broadcast, and VS Code themes."

[[bin]]
name = "bethterm"
path = "src/main.rs"

[dependencies]
# Our delta crate
wtinator = { workspace = true }

# Upstream public crates we need for the binary entry point
config = { workspace = true }
mux = { workspace = true }

# Third-party
anyhow = { workspace = true }

[lints.rust]
unused_must_use = "deny"
