<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- no-referrer só nos links para fora. Os arquivos da própria página
         (JS, CSS) precisam mandar a origem, senão o servidor recusa o token
         e a tela fica vazia. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Beth Studio</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Tela de abertura: aparece antes do JavaScript (~900 KB) carregar. O
         React troca o conteúdo de #root e segue com a StartupOverlay (mesmo
         visual). O giro é animação de CSS: continua mesmo com a página ocupada. -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 15px "Segoe UI", system-ui, sans-serif; color: #8c8c8c; background: #1e1e1e; }
      #boot img { width: 64px; height: 64px; border-radius: 22.37%; }
      #boot .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(140, 140, 140, 0.25); border-top-color: #4b8cf5; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-bg-body text-text-1">
    <div id="root"><div id="boot"><img src="./bethstudio-64.png" alt="" /><div class="spin"></div><div>Abrindo Beth Studio…</div></div></div>
    <script>
      window.__bethMark = "boot";
      window.addEventListener("error", function (e) { window.__bethErr = String(e.message || e.error || e); });
      window.addEventListener("unhandledrejection", function (e) { window.__bethErr = "reject " + String(e.reason); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
